<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Login | Sala ETEC</title>

        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
    </head>

    <body>
        <section class="section is-large">
            <div class="container">

                <h1 class="title has-text-centered">
                    Sala ETEC
                </h1>

                <h2 class="subtitle has-text-centered">
                    Central de informações da ETEC
                </h2>

                <div class="is-flex is-justify-content-center">
                    <div class="box form-login-box">

                        <h2 class="title has-text-centered">
                            Entrar
                        </h2>

                        {% if error %}
                            <div class="notification is-danger">
                                {{ error }}
                            </div>
                        {% endif %}

                        <form
                            class="form-login"
                            action="{{ url_for('login') }}"
                            method="post"
                        >

                            <div class="field">
                                <label
                                    class="label"
                                    for="name-input"
                                >
                                    Usuário
                                </label>

                                <div class="control">
                                    <input
                                        class="input"
                                        id="name-input"
                                        type="text"
                                        name="name"
                                        placeholder="Joãozinho"
                                        required
                                    />
                                </div>
                            </div>

                            <div class="field">
                                <label
                                    class="label"
                                    for="password-input"
                                >
                                    Senha
                                </label>

                                <div class="control">
                                    <input
                                        class="input"
                                        id="password-input"
                                        type="password"
                                        name="password"
                                        placeholder="Senha123"
                                        required
                                    />
                                </div>
                            </div>

                            <button
                                class="button is-link"
                                type="submit"
                            >
                                Entrar
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </section>
    </body>
</html>
